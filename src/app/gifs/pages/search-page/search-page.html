<h2 class="text-2xl font-bold mt-5">Buscar Gifs</h2>
<h3 class="text-sm text-gray-500">Buscar gifs por nombre, descripción o tags</h3>

<section class="flex flex-col gap-4">
  <input
    type="text"
    placeholder="Buscar Gifs"
    class="mt-3 w-full border border-gray-300 bg-white rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
    (keyup.enter)="onSearch(txtSearch.value)"
    #txtSearch
  >
</section>

@if (searchError(); as error) {
  <p class="mt-4 rounded-md bg-red-50 p-4 text-red-700" role="alert">{{ error }}</p>
}

<section class="py-5">
  <gif-list [gifs]="gifs()"/>

</section>
