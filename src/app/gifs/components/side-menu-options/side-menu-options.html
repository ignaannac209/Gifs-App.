<div id="nav" class="w-full px-6">
  <!-- bg-blue-800 -->

  @for (item of menuOptions; track item.route) {
  <a
    [routerLink]="item.route"
    routerLinkActive="bg-blue-800"
    class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
  >
    <div>

      <!--  <i [class]="item.icon"></i>-->
     <i class="{{ item.icon }}"></i>

    </div>
    <div class="flex flex-col">
      <span class="text-lg font-bold leading-5 text-white">{{ item.label}}</span>
      <span class="text-sm text-white/50 hidden md:block">{{ item.subLabel }}</span>
    </div>
  </a>

  }


  @for (key of gifService.searchHistoryKeys(); track key){
    <div class="w-full inline-flex items-center border-b border-slate-700 hover:bg-white/5 transition ease-linear duration-150">
      <a
        [routerLink]="['/dashboard/history', key]"
        routerLinkActive="bg-blue-800"
        class="min-w-0 flex-1 px-2 inline-flex space-x-2 items-center py-3"
      >
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span class="text-lg font-bold leading-5 text-white">{{ key }}</span>
      </a>
      <button
        type="button"
        [attr.aria-label]="'Eliminar búsqueda ' + key + ' del historial'"
        title="Eliminar del historial"
        (click)="gifService.removeSearchFromHistory(key)"
        class="px-3 py-3 text-white/60 hover:text-white hover:bg-red-600/70 transition"
      >
        x
      </button>
    </div>
  }

</div>
